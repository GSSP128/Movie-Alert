
name: booking-watch

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor Avengers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          CONFIG_PATH: config.json
          STATE_PATH: state-avengers.json
        run: python poller.py

      - name: Monitor Dune
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          CONFIG_PATH: config-dune.json
          STATE_PATH: state-dune.json
        run: python poller.py

      - name: Save monitoring states
        run: |
          if [[ -n "$(git status --porcelain state-avengers.json state-dune.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state-avengers.json state-dune.json
            git commit -m "Update movie monitoring states [skip ci]"
            git push
          else
            echo "No state changes."
          fi
